<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
  </defs>
  <!-- Pentagon shape (like MTG) -->
  <polygon points="50,5 95,38 77,90 23,90 5,38" fill="url(#grad)" stroke="#1a1a2e" stroke-width="3"/>
  <!-- Inner pentagon -->
  <polygon points="50,20 80,43 68,78 32,78 20,43" fill="#1a1a2e"/>
  <!-- M letter -->
  <path d="M30,70 L30,40 L50,55 L70,40 L70,70" fill="none" stroke="#e94560" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
